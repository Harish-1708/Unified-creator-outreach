name: Asana Sync

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Which discovery Campaign to sync (must have asana_sync=true in its settings, or nothing will happen)"
        required: true
      dry_run:
        description: "true to preview what would be created/updated without writing anything, to either sheet or Asana"
        required: false
        default: "false"
  schedule:
    # Runs as a backstop, not the primary trigger — see asana_sync.py's own
    # docstring: this is meant to be an independent projection, so a
    # periodic catch-up run is the natural default rather than something
    # that has to be remembered after every approval.
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asana
    env:
      PYTHONPATH: ${{ github.workspace }}/discovery:${{ github.workspace }}/asana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests gspread google-auth PyYAML
      - name: Write service account file
        run: echo "$GCP_SA_KEY" > service_account.json
        env:
          GCP_SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Run Asana sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ./service_account.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_PROJECT_GID: ${{ secrets.ASANA_PROJECT_GID }}
          CAMPAIGN: ${{ github.event.inputs.campaign }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python run_sync.py
      - name: Clean up service account file
        if: always()
        run: rm -f service_account.json
