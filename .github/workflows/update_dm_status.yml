name: Update DM Status

on:
  workflow_dispatch:
    inputs:
      creator_key:
        description: "dedup_key of the creator (e.g. instagram:dudedad)"
        required: true
      campaign:
        description: "Campaign — must match exactly (case-sensitive)"
        required: true
      dm_status:
        description: "One of: Not Contacted, Draft Ready, Sent, Follow-up Needed, Replied, Interested, Not Interested, No Response, Closed"
        required: true
      dm_notes:
        description: "Free-text notes (optional)"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Write service account file
        run: echo "$GCP_SA_KEY" > service_account.json
        env:
          GCP_SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Update DM status
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ./service_account.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CREATOR_KEY: ${{ github.event.inputs.creator_key }}
          CAMPAIGN: ${{ github.event.inputs.campaign }}
          DM_STATUS: ${{ github.event.inputs.dm_status }}
          DM_NOTES: ${{ github.event.inputs.dm_notes }}
        run: python update_dm_status.py
      - name: Clean up service account file
        if: always()
        run: rm -f service_account.json
