name: Update Review Decision

on:
  workflow_dispatch:
    inputs:
      creator_key:
        description: "dedup_key of the creator (e.g. instagram:dudedad) — or a comma-separated list to apply the same decision to several at once (e.g. instagram:dudedad,instagram:joshherbert)"
        required: true
      campaign:
        description: "Campaign — must match exactly (case-sensitive)"
        required: true
      review_status:
        description: "Approved, Rejected, or Pending"
        required: true
      outreach_channel:
        description: "email, dm, none, or blank"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Write service account file
        run: echo "$GCP_SA_KEY" > service_account.json
        env:
          GCP_SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Update review decision
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ./service_account.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CREATOR_KEY: ${{ github.event.inputs.creator_key }}
          CAMPAIGN: ${{ github.event.inputs.campaign }}
          REVIEW_STATUS: ${{ github.event.inputs.review_status }}
          OUTREACH_CHANNEL: ${{ github.event.inputs.outreach_channel }}
        run: python update_review_decision.py
      - name: Clean up service account file
        if: always()
        run: rm -f service_account.json
